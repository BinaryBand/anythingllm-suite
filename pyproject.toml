# The root of the Python side: a virtual workspace, so it has no project of its own. packages/mcp is its
# only member for now; the bridge is TypeScript (packages/package.json is the JavaScript side). The lock
# and the ruff rules below are for Python parts. `uv lock` works once packages/mcp holds its pyproject.toml.

[tool.uv.workspace]
members = ["packages/mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "ANN", "ASYNC", "S", "BLE", "B", "A", "C4", "C90", "DTZ",
    "T10", "EXE", "FA", "ICN", "LOG", "G", "INP", "PIE", "T20", "PT", "RSE", "RET", "SLF", "SIM",
    "TID", "ARG", "PTH", "ERA", "PGH", "PL", "FLY", "PERF", "FURB", "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
