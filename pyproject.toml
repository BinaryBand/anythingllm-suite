# The root of the Python side: a virtual workspace, so it has no project of its own. The two members are
# separate distributions with their own pyproject.toml; what they share is this lock and the ruff rules
# below. `uv lock` works once packages/bridge and packages/mcp hold their pyproject.toml.

[tool.uv.workspace]
members = ["packages/bridge", "packages/mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "ANN", "ASYNC", "S", "BLE", "B", "A", "C4", "C90", "DTZ",
    "T10", "EXE", "FA", "ICN", "LOG", "G", "INP", "PIE", "T20", "PT", "RSE", "RET", "SLF", "SIM",
    "TID", "ARG", "PTH", "ERA", "PGH", "PL", "FLY", "PERF", "FURB", "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
