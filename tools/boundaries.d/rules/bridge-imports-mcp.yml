id: bridge-imports-mcp
language: python
severity: error
message: packages/bridge must not import packages/mcp; the parts share contract/, never modules.
files:
  - packages/bridge/**/*.py
rule:
  any:
    - kind: import_statement
    - kind: import_from_statement
  regex: '^(from\s+|import\s+([\w.]+\s*,\s*)*)(chat_mcp|schedule_mcp|sandbox_mcp|memory_mcp|deploy_mcp|toolkit_client)\b'
