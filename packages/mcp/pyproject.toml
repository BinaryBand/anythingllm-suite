[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP servers for MCP clients: AnythingLLM's chats and scheduled jobs through the bridge"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "mcp>=2.3,<3"]

[project.scripts]
anythingllm-mcp-control = "control_mcp.__main__:main"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_mcp"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# tests/fakes.py is shared by the unit tests and the stdio test.
pythonpath = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# A server registers its tools one after another in one function; that is flat, not complex,
# and a tool takes the arguments the agent passes it.
"src/control_mcp/server.py" = ["C901", "PLR0913", "PLR0917"]
# A test (and an e2e test, which tools/e2e runs) asserts, takes the fixtures it needs, and
# compares against literals.
"{tests,e2e}/**" = ["S101", "ANN", "INP001", "PLR2004"]
# Runs systemctl with fixed arguments, never a shell.
"src/control_mcp/install.py" = ["S603"]
# The stand-in for AnythingLLM is a router: one branch for each route.
"tests/fakes.py" = ["C901", "PLR0911"]
