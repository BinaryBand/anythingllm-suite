[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP servers for MCP clients, started over stdio"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "mcp>=2.3,<3"]

[project.scripts]
anythingllm-mcp-hello = "hello_mcp.__main__:main"
anythingllm-mcp-world = "world_mcp.__main__:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hello_mcp", "world_mcp"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# A test asserts, takes the fixtures it needs, and compares against literals.
"tests/**" = ["S101", "ANN", "INP001", "PLR2004"]
