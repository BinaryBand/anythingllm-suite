<!--part
{"name":"table","line":"rows to sort, filter and edit in place: a sheet, a log","schema":{"type":"object","required":["columns","rows"],"properties":{"columns":{"type":"array","minItems":1,"maxItems":12,"items":{"type":"object","required":["key","label"],"properties":{"key":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,39}$"},"label":{"type":"string","minLength":1,"maxLength":40},"type":{"enum":["text","number","date"]}}}},"rows":{"type":"array","maxItems":1000,"items":{"type":"object"}}}},"data":{"columns":[{"key":"item","label":"Item"},{"key":"amount","label":"Amount","type":"number"}],"rows":[]},"events":["edit","add-row","remove-row"]}
-->
<div class="stack" data-part="table">
<input type="search" data-ref="filter" placeholder="Filter" aria-label="Filter the rows">
<div class="scroll"><table><thead><tr data-ref="head"></tr></thead><tbody data-ref="rows"></tbody></table></div>
<p class="empty" data-ref="none">No rows yet. Add the first one.</p>
<button type="button" data-ref="add">Add a row</button>
</div>
<script>
App.mount("table", ({ at, q }) => {
  // How the rows are sorted and filtered is this page's own, never the data's.
  let sortKey = null, up = true, filter = "";
  const cellOf = (col, v) => (v === undefined || v === null ? "" : col.type === "number" && typeof v === "number" ? v.toLocaleString() : String(v));
  const valueOf = (col, text) => {
    const t = text.trim();
    if (col.type === "number") return t === "" ? null : Number(t.replace(/[^0-9.+-]/g, ""));
    return t;
  };
  q("filter").oninput = () => ((filter = q("filter").value.trim().toLowerCase()), draw());
  q("add").onclick = () => {
    const cols = App.get(at + "/columns");
    App.patch([{ op: "add", path: at + "/rows/-", value: Object.fromEntries(cols.map((c) => [c.key, c.type === "number" ? 0 : ""])) }], { ev: "add-row" });
  };
  function edit(i, row, col, td) {
    const input = el("input", { value: row[col.key] ?? "", ariaLabel: col.label, inputMode: col.type === "number" ? "decimal" : "text", type: col.type === "date" ? "date" : "text" });
    const done = (save) => {
      const v = valueOf(col, input.value);
      if (save && v !== row[col.key] && !(col.type === "number" && Number.isNaN(v)))
        App.patch([{ op: "test", path: `${at}/rows/${i}`, value: row }, { op: "add", path: `${at}/rows/${i}/${col.key}`, value: v }], { ev: "edit", column: col.key });
      else draw();
    };
    input.onkeydown = (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
    input.onblur = () => done(true);
    td.replaceChildren(input);
    input.focus();
  }
  function draw() {
    const { columns, rows } = App.get(at);
    q("head").replaceChildren(...columns.map((c) => {
      const b = el("button", { type: "button", textContent: c.label + (sortKey === c.key ? (up ? " ↑" : " ↓") : "") });
      b.onclick = () => ((up = sortKey === c.key ? !up : c.type !== "number"), (sortKey = c.key), draw());
      const th = el("th", { scope: "col" });
      th.setAttribute("aria-sort", sortKey === c.key ? (up ? "ascending" : "descending") : "none");
      th.append(b);
      return th;
    }), el("th", { scope: "col", textContent: "" }));
    let shown = rows.map((row, i) => ({ row, i }));
    if (filter) shown = shown.filter(({ row }) => columns.some((c) => cellOf(c, row[c.key]).toLowerCase().includes(filter)));
    if (sortKey) {
      const col = columns.find((c) => c.key === sortKey);
      shown.sort((a, b) => {
        const x = a.row[sortKey], y = b.row[sortKey];
        const d = col && col.type === "number" ? (Number(x) || 0) - (Number(y) || 0) : String(x ?? "").localeCompare(String(y ?? ""));
        return up ? d : -d;
      });
    }
    q("none").hidden = rows.length > 0;
    q("rows").replaceChildren(...shown.map(({ row, i }) => {
      const tr = el("tr");
      for (const col of columns) {
        const td = el("td");
        const b = el("button", { type: "button", className: "quiet", textContent: cellOf(col, row[col.key]) || "—", ariaLabel: `${col.label}: ${cellOf(col, row[col.key]) || "empty"}, edit` });
        b.onclick = () => edit(i, row, col, td);
        td.append(b);
        tr.append(td);
      }
      const gone = el("button", { type: "button", className: "quiet", textContent: "✕", ariaLabel: "Remove this row" });
      gone.onclick = () => App.patch([{ op: "test", path: `${at}/rows/${i}`, value: row }, { op: "remove", path: `${at}/rows/${i}` }], { ev: "remove-row" });
      const td = el("td");
      td.append(gone);
      tr.append(td);
      return tr;
    }));
  }
  return draw;
});
</script>
